<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <meta name="author" content="Jorgelina Flores">
    <meta name="description" content="Formulario de contacto para la página web.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <form action="procesar.php" method="post" novalidate>
            <fieldset>
                <legend>Formulario de Datos Personales</legend>
                <span id="control-nombre" aria-live="polite"></span>
                <section>
                    <label for="nom">Nombre:</label>
                    <input type="text" id="nom" name="nombre" 
                        required 
                        maxlength="100"
                        placeholder="Ej: Juan"
                        autocomplete="given-name"
                        aria-describedby="control-nombre">
                </section>
                <span id="control-apellido" aria-live="polite"></span>
                <section>
                    <label for="ape">Apellido:</label>
                    <input type="text" id="ape" name="apellido" 
                        required 
                        maxlength="100"
                        placeholder="Ej: Perez"
                        autocomplete="family-name"
                        aria-describedby="control-apellido">
                </section>
                <span id="control-email" aria-live="polite"></span>
                <section>
                    <label for="mail">Email:</label>
                    <input type="email" id="mail" name="email" 
                        required 
                        maxlength="100"
                        placeholder="ejemplo@dominio.com"
                        autocomplete="email"
                        aria-describedby="control-email">
                </section>
                <span id="control-fechanac" aria-live="polite"></span>
                <section>
                    <label for="fech">Fecha de nacimiento:</label>
                    <input type="date" id="fech" name="fechanac" 
                        required
                        min="1900-01-01"
                        autocomplete="bday"
                        aria-describedby="control-fechanac">
                </section>
                <span id="control-paises" aria-live="polite"></span>
                <section>
                    <label for="paises">País de residencia:</label>
                    <select id="paises" name="pais" required autocomplete="country" aria-describedby="control-paises">
                        <option value="" selected disabled hidden>Seleccione un país</option>
                        <option value="es">España</option>
                        <option value="ar">Argentina</option>
                        <option value="eng">Inglaterra</option>
                        <option value="fr">Francia</option>
                        <option value="otro">Otro</option>
                    </select>
                </section>
                <input type="submit" value="Enviar" class="botones">
                <button type="button" id="modo-oscuro" class="botones" aria-pressed="false">Estilo de Alto Contraste</button>
            </fieldset>
        </form>
    </main>
    <script src="script1.js"></script>
</body>
</html>
